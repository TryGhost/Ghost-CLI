  e2e:
    runs-on: ${{ matrix.os }}
    name: E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04]
        password: [root]
        node: [22.x]
    steps:
      - name: Start nginx
        run: sudo service nginx start
      - name: Updating hosts file
        run: 'echo -e "127.0.0.1 cli-testing.ghost.org\n" | sudo tee -a /etc/hosts'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: "cli"
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: cli/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: cli/pnpm-lock.yaml
        env:
          FORCE_COLOR: 0
      - name: Start MySQL service
        run: sudo systemctl start mysql.service
      - name: Prepare CLI
        run: |
          cp -r ./cli /opt/cli
          chmod 755 /opt/cli
          cd /opt/cli
          pnpm install --frozen-lockfile
          sudo ln -s /opt/cli/bin/ghost /usr/local/bin/ghost
      - name: Setting up install directory
        run: |
          mkdir /opt/ghost-e2e-test
          chmod 775 /opt/ghost-e2e-test
      - name: Setting up Ghost instance
        run: |
          ghost install \
            -d /opt/ghost-e2e-test \
            --auto \
            --no-prompt \
            --url http://cli-testing.ghost.org \
            --db mysql \
            --dbhost 127.0.0.1 \
            --dbuser root \
            --dbpass ${{ matrix.password }} \
            --dbname ghost-mysql
      - name: Debugging Failure
        if: failure()
        run: journalctl -u ghost_cli-testing-ghost-org -n 100
      - name: Verifying Installation
        run: curl http://cli-testing.ghost.org | grep ghost
      - name: Normalizing install permissions
        run: |
          cd /opt/ghost-e2e-test
          sudo find ./ -type d -exec chmod 00775 {} \;
          sudo find ./ ! -path "./versions/*" ! -path "./.pnpm-store/*" -type f -exec chmod 664 {} \;
      - name: Recording running service pid
        run: |
          BEFORE_PID="$(sudo systemctl show -p MainPID --value ghost_cli-testing-ghost-org)"
          if [ -z "$BEFORE_PID" ] || [ "$BEFORE_PID" = "0" ]; then
            echo "Ghost service did not expose a running MainPID before stop"
            exit 1
          fi
          echo "STOP_START_BEFORE_PID=$BEFORE_PID" >> "$GITHUB_ENV"
      - name: Stopping Ghost instance
        run: |
          cd /opt/ghost-e2e-test
          ghost stop
          for attempt in {1..15}; do
            service_stopped=true
            site_stopped=true

            if sudo systemctl is-active --quiet ghost_cli-testing-ghost-org; then
              service_stopped=false
            fi

            if curl -fsS http://cli-testing.ghost.org > /dev/null; then
              site_stopped=false
            fi

            if [ "$service_stopped" = true ] && [ "$site_stopped" = true ]; then
              exit 0
            fi

            sleep 2
          done

          echo "Ghost service did not fully stop within the retry window"
          exit 1
      - name: Starting Ghost instance
        run: |
          cd /opt/ghost-e2e-test
          ghost start
      - name: Verifying Restart
        run: |
          for attempt in {1..15}; do
            AFTER_PID="$(sudo systemctl show -p MainPID --value ghost_cli-testing-ghost-org)"

            if sudo systemctl is-active --quiet ghost_cli-testing-ghost-org && \
              [ -n "$AFTER_PID" ] && \
              [ "$AFTER_PID" != "0" ] && \
              [ "$AFTER_PID" != "$STOP_START_BEFORE_PID" ] && \
              curl -fsS http://cli-testing.ghost.org | grep -qi ghost; then
              exit 0
            fi

            sleep 2
          done

          echo "Ghost service did not come back with a new pid after restart"
          exit 1
      - name: Debugging Restart Failure
        if: failure()
        run: |
          journalctl -u ghost_cli-testing-ghost-org -n 100
          curl -i http://cli-testing.ghost.org || true

  e2e-mysql84:
    runs-on: ubuntu-latest
    name: E2E (MySQL 8.4)
    steps:
      - name: Start nginx
        run: sudo service nginx start
      - name: Stop system MySQL
        run: sudo systemctl stop mysql.service || true
      - name: Start MySQL 8.4
        run: |
          docker run -d --name mysql84 \
            --network host \
            -e MYSQL_ROOT_PASSWORD=root \
            mysql:8.4
      - name: Wait for MySQL 8.4
        run: |
          until docker exec mysql84 mysqladmin ping -h 127.0.0.1 -uroot -proot --silent 2>/dev/null; do
            sleep 2
          done
      - name: Updating hosts file
        run: 'echo -e "127.0.0.1 cli-testing.ghost.org\n" | sudo tee -a /etc/hosts'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: "cli"
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: cli/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: cli/pnpm-lock.yaml
        env:
          FORCE_COLOR: 0
      - name: Prepare CLI
        run: |
          cp -r ./cli /opt/cli
          chmod 755 /opt/cli
          cd /opt/cli
          pnpm install --ignore-scripts --frozen-lockfile
          sudo ln -s /opt/cli/bin/ghost /usr/local/bin/ghost
      - name: Setting up install directory
        run: |
          mkdir /opt/ghost-e2e-test
          chmod 775 /opt/ghost-e2e-test
      - name: Setting up Ghost instance
        run: |
          ghost install \
            -d /opt/ghost-e2e-test \
            --auto \
            --no-prompt \
            --url http://cli-testing.ghost.org \
            --db mysql \
            --dbhost 127.0.0.1 \
            --dbuser root \
            --dbpass root \
            --dbname ghost-mysql
      - name: Debugging Failure
        if: failure()
        run: journalctl -u ghost_cli-testing-ghost-org -n 100
      - name: Verifying Installation
        run: curl http://cli-testing.ghost.org | grep ghost

  e2e-update:
    runs-on: ubuntu-latest
    name: E2E (Update)
    env:
      UPDATE_ARCHIVE_DIR: /tmp/ghost-archives
      UPDATE_DIR: /opt/ghost-e2e-update
      UPDATE_MAJOR: 6
      UPDATE_SERVICE: ghost_cli-update-testing-ghost-org
      UPDATE_URL: http://cli-update-testing.ghost.org
    steps:
      - name: Start nginx
        run: sudo service nginx start
      - name: Updating hosts file
        run: 'echo -e "127.0.0.1 cli-update-testing.ghost.org\n" | sudo tee -a /etc/hosts'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: "cli"
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: cli/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: cli/pnpm-lock.yaml
        env:
          FORCE_COLOR: 0
      - name: Start MySQL service
        run: sudo systemctl start mysql.service
      - name: Prepare CLI
        run: |
          cp -r ./cli /opt/cli
          chmod 755 /opt/cli
          cd /opt/cli
          pnpm install --ignore-scripts --frozen-lockfile
          sudo ln -s /opt/cli/bin/ghost /usr/local/bin/ghost
      - name: Resolve Ghost update versions within supported major
        run: |
          node <<'NODE' >> "$GITHUB_ENV"
          const {execSync} = require('child_process');
          const semver = require('/opt/cli/node_modules/semver');

          const updateMajor = Number(process.env.UPDATE_MAJOR);
          const versions = JSON.parse(execSync('npm view ghost versions --json', {encoding: 'utf8'}));
          const stableVersions = versions
              .filter(version => semver.valid(version) && !semver.prerelease(version))
              .filter(version => semver.major(version) === updateMajor)
              .sort(semver.rcompare);

          if (stableVersions.length < 2) {
              throw new Error(`Expected at least two stable Ghost ${updateMajor}.x releases, found ${stableVersions.length}`);
          }

          const targetVersion = stableVersions[0];
          const sourceVersion = stableVersions.find(version => semver.lt(version, targetVersion));

          if (!sourceVersion) {
              throw new Error(`Could not determine a source version for Ghost ${updateMajor}.x`);
          }

          console.log(`UPDATE_FROM_VERSION=${sourceVersion}`);
          console.log(`UPDATE_TO_VERSION=${targetVersion}`);
          NODE
      - name: Download pinned Ghost archives
        run: |
          mkdir -p "$UPDATE_ARCHIVE_DIR"
          npm pack ghost@"$UPDATE_FROM_VERSION" --pack-destination "$UPDATE_ARCHIVE_DIR"
          npm pack ghost@"$UPDATE_TO_VERSION" --pack-destination "$UPDATE_ARCHIVE_DIR"
      - name: Setting up install directory
        run: |
          mkdir "$UPDATE_DIR"
          chmod 775 "$UPDATE_DIR"
      - name: Setting up Ghost instance from archive
        run: |
          ghost install \
            -d "$UPDATE_DIR" \
            --archive "$UPDATE_ARCHIVE_DIR/ghost-$UPDATE_FROM_VERSION.tgz" \
            --auto \
            --no-prompt \
            --url "$UPDATE_URL" \
            --db mysql \
            --dbhost 127.0.0.1 \
            --dbuser root \
            --dbpass root \
            --dbname ghost-update-mysql
      - name: Verifying Installation
        run: curl "$UPDATE_URL" | grep ghost
      - name: Normalizing install permissions
        run: |
          cd "$UPDATE_DIR"
          sudo find ./ -type d -exec chmod 00775 {} \;
          sudo find ./ ! -path "./versions/*" ! -path "./.pnpm-store/*" -type f -exec chmod 664 {} \;
      - name: Recording running service pid before update
        run: |
          BEFORE_PID="$(sudo systemctl show -p MainPID --value "$UPDATE_SERVICE")"
          if [ -z "$BEFORE_PID" ] || [ "$BEFORE_PID" = "0" ]; then
            echo "Ghost service did not expose a running MainPID before update"
            exit 1
          fi
          echo "UPDATE_BEFORE_PID=$BEFORE_PID" >> "$GITHUB_ENV"
      - name: Updating Ghost instance from archive
        run: |
          cd "$UPDATE_DIR"
          ghost update --archive "$UPDATE_ARCHIVE_DIR/ghost-$UPDATE_TO_VERSION.tgz"
      - name: Verifying Update
        run: |
          cd "$UPDATE_DIR"
          ghost version | grep "Ghost version: $UPDATE_TO_VERSION"
          if [ "$(readlink -f current)" != "$UPDATE_DIR/versions/$UPDATE_TO_VERSION" ]; then
            echo "Current symlink does not point to the updated version"
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync(`${process.env.UPDATE_DIR}/.ghost-cli`, 'utf8'));
          const currentPackage = JSON.parse(fs.readFileSync(`${process.env.UPDATE_DIR}/current/package.json`, 'utf8'));

          if (currentPackage.version !== process.env.UPDATE_TO_VERSION) {
              throw new Error(`Expected current package version ${process.env.UPDATE_TO_VERSION}, received ${currentPackage.version}`);
          }

          if (config['active-version'] !== process.env.UPDATE_TO_VERSION) {
              throw new Error(`Expected active-version ${process.env.UPDATE_TO_VERSION}, received ${config['active-version']}`);
          }

          if (config['previous-version'] !== process.env.UPDATE_FROM_VERSION) {
              throw new Error(`Expected previous-version ${process.env.UPDATE_FROM_VERSION}, received ${config['previous-version']}`);
          }
          NODE
          for attempt in {1..15}; do
            AFTER_PID="$(sudo systemctl show -p MainPID --value "$UPDATE_SERVICE")"

            if sudo systemctl is-active --quiet "$UPDATE_SERVICE" && \
              [ -n "$AFTER_PID" ] && \
              [ "$AFTER_PID" != "0" ] && \
              [ "$AFTER_PID" != "$UPDATE_BEFORE_PID" ] && \
              curl -fsS "$UPDATE_URL" | grep -qi ghost; then
              exit 0
            fi

            sleep 2
          done

          echo "Ghost did not come back with the updated release and a new pid"
          exit 1
      - name: Debugging Failure
        if: failure()
        run: |
          journalctl -u "$UPDATE_SERVICE" -n 100
          curl -i "$UPDATE_URL" || true

  e2e-import-export:
    runs-on: ubuntu-latest
    name: E2E (Import/Export from v${{ matrix.source_major }})
    strategy:
      fail-fast: false
      matrix:
        # The target is always the current major - we only care that recent
        # exports can be imported into it
        source_major: [5, 6]
    env:
      TARGET_MAJOR: 6
      SOURCE_DIR: /opt/ghost-e2e-source
      SOURCE_URL: http://cli-source-testing.ghost.org
      SOURCE_EXPORT: /tmp/e2e-source-export.json
      TARGET_DIR: /opt/ghost-e2e-target
      TARGET_URL: http://cli-target-testing.ghost.org
      TARGET_EXPORT: /tmp/e2e-target-export.json
      OWNER_EMAIL: e2e-owner@ghost.org
      POST_TITLE: Ghost-CLI import export e2e
    steps:
      - name: Generating an owner password
        run: |
          # Ghost rejects passwords from its insecure password blocklist, so
          # this is generated rather than hardcoded
          OWNER_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$OWNER_PASSWORD"
          echo "OWNER_PASSWORD=$OWNER_PASSWORD" >> "$GITHUB_ENV"
      - name: Start nginx
        run: sudo service nginx start
      - name: Updating hosts file
        run: 'echo -e "127.0.0.1 cli-source-testing.ghost.org\n127.0.0.1 cli-target-testing.ghost.org\n" | sudo tee -a /etc/hosts'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: "cli"
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: cli/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: cli/pnpm-lock.yaml
        env:
          FORCE_COLOR: 0
      - name: Start MySQL service
        run: sudo systemctl start mysql.service
      - name: Prepare CLI
        run: |
          cp -r ./cli /opt/cli
          chmod 755 /opt/cli
          cd /opt/cli
          pnpm install --ignore-scripts --frozen-lockfile
          sudo ln -s /opt/cli/bin/ghost /usr/local/bin/ghost
      - name: Setting up source instance (Ghost v${{ matrix.source_major }})
        run: |
          mkdir "$SOURCE_DIR"
          chmod 775 "$SOURCE_DIR"
          ghost install ${{ matrix.source_major }} \
            -d "$SOURCE_DIR" \
            --auto \
            --no-prompt \
            --url "$SOURCE_URL" \
            --db mysql \
            --dbhost 127.0.0.1 \
            --dbuser root \
            --dbpass root \
            --dbname ghost_e2e_source
      - name: Setting up target instance (Ghost v6)
        run: |
          mkdir "$TARGET_DIR"
          chmod 775 "$TARGET_DIR"
          ghost install "$TARGET_MAJOR" \
            -d "$TARGET_DIR" \
            --auto \
            --no-prompt \
            --url "$TARGET_URL" \
            --db mysql \
            --dbhost 127.0.0.1 \
            --dbuser root \
            --dbpass root \
            --dbname ghost_e2e_target
      - name: Normalizing install permissions
        run: |
          for dir in "$SOURCE_DIR" "$TARGET_DIR"; do
            cd "$dir"
            sudo find ./ -type d -exec chmod 00775 {} \;
            sudo find ./ ! -path "./versions/*" ! -path "./.pnpm-store/*" -type f -exec chmod 664 {} \;
          done
      - name: Disabling staff device verification
        run: |
          # Both instances are driven over the Admin API with a password, which 2FA would block
          for dir in "$SOURCE_DIR" "$TARGET_DIR"; do
            cd "$dir"
            ghost config set security.staffDeviceVerification false
            ghost restart
          done
      - name: Setting up blog owners
        run: |
          node /opt/cli/scripts/e2e-api.js setup "$SOURCE_URL" "$OWNER_EMAIL" "$OWNER_PASSWORD" "Source blog"
          node /opt/cli/scripts/e2e-api.js setup "$TARGET_URL" "$OWNER_EMAIL" "$OWNER_PASSWORD" "Target blog"
      - name: Creating content to export
        run: node /opt/cli/scripts/e2e-api.js create-post "$SOURCE_URL" "$OWNER_EMAIL" "$OWNER_PASSWORD" "$POST_TITLE"
      - name: Reading staff access tokens
        run: |
          SOURCE_TOKEN="$(node /opt/cli/scripts/e2e-api.js token "$SOURCE_URL" "$OWNER_EMAIL" "$OWNER_PASSWORD")"
          TARGET_TOKEN="$(node /opt/cli/scripts/e2e-api.js token "$TARGET_URL" "$OWNER_EMAIL" "$OWNER_PASSWORD")"
          echo "::add-mask::$SOURCE_TOKEN"
          echo "::add-mask::$TARGET_TOKEN"
          echo "SOURCE_TOKEN=$SOURCE_TOKEN" >> "$GITHUB_ENV"
          echo "TARGET_TOKEN=$TARGET_TOKEN" >> "$GITHUB_ENV"
      - name: Exporting from source instance
        env:
          GHOST_CLI_STAFF_AUTH_TOKEN: ${{ env.SOURCE_TOKEN }}
        run: |
          cd "$SOURCE_DIR"
          ghost export "$SOURCE_EXPORT"
          node /opt/cli/scripts/e2e-api.js assert-post "$SOURCE_EXPORT" "$POST_TITLE"
      - name: Importing into target instance
        env:
          GHOST_CLI_STAFF_AUTH_TOKEN: ${{ env.TARGET_TOKEN }}
        run: |
          cd "$TARGET_DIR"
          ghost import "$SOURCE_EXPORT"
      - name: Verifying Import
        env:
          GHOST_CLI_STAFF_AUTH_TOKEN: ${{ env.TARGET_TOKEN }}
        run: |
          cd "$TARGET_DIR"
          ghost export "$TARGET_EXPORT"
          node /opt/cli/scripts/e2e-api.js assert-post "$TARGET_EXPORT" "$POST_TITLE"
          curl -fsS "$TARGET_URL" | grep -qi ghost
      - name: Debugging Failure
        if: failure()
        run: |
          journalctl -u ghost_cli-source-testing-ghost-org -n 100 || true
          journalctl -u ghost_cli-target-testing-ghost-org -n 100 || true

  # Single job to hang branch protection off of - it passes only when every
  # job above succeeded or was skipped
  required-tests:
    name: All required tests passed or skipped
    needs:
      [
        unit,
        local-e2e-linux,
        local-e2e-macos,
        local-e2e-windows,
        e2e,
        e2e-mysql84,
        e2e-update,
        e2e-import-export
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Output needs
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: echo "$NEEDS_JSON"
      - name: Check if any required jobs failed or were cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One of the dependent jobs has failed or been cancelled. You may need to re-run it." && exit 1
