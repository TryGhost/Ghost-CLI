name: CI
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    env:
      FORCE_COLOR: 1
    name: Unit (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
        env:
          FORCE_COLOR: 0
      - run: pnpm install
      - run: pnpm lint
      # `pnpm coverage` runs the same specs as `pnpm test`, minus the posttest
      # lint that's already run above
      - run: pnpm coverage
      # Every matrix leg covers the same lines, so one upload is enough. Forks
      # don't report to Ghost-CLI's Codecov project, so skip them too
      - name: Upload coverage
        if: matrix.node == '22.x' && github.repository == 'TryGhost/Ghost-CLI'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          flags: unit-tests
          files: coverage/cobertura-coverage.xml
          disable_search: true

  local-e2e-linux:
    runs-on: ubuntu-latest
    name: Local E2E (ubuntu-latest)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: "cli"
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: cli/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: cli/pnpm-lock.yaml
      - name: Prepare CLI
        working-directory: ./cli
        run: pnpm install --frozen-lockfile
      - name: Setting up Ghost instance
        run: node ./cli/bin/ghost install local -d ghost
      - name: Verifying Installation
        run: |
          for attempt in {1..15}; do
            if curl -fsS http://localhost:2368 | grep -qi ghost; then
              exit 0
            fi
            sleep 2
          done

          echo "Ghost site did not become reachable after install"
          exit 1
      - name: Recording running process pid
        run: |
          if [ ! -f ghost/.ghostpid ]; then
            echo "Ghost pidfile was missing before stop"
            exit 1
          fi
          BEFORE_PID="$(cat ghost/.ghostpid)"
          if [ -z "$BEFORE_PID" ]; then
            echo "Ghost pidfile was empty before stop"
            exit 1
          fi
          echo "LOCAL_BEFORE_PID=$BEFORE_PID" >> "$GITHUB_ENV"
      - name: Stopping Ghost instance
        run: |
          node ./cli/bin/ghost stop -d ghost
          for attempt in {1..15}; do
            pidfile_removed=true
            site_stopped=true

            if [ -f ghost/.ghostpid ]; then
              pidfile_removed=false
            fi

            if curl -fsS http://localhost:2368 > /dev/null; then
              site_stopped=false
            fi

            if [ "$pidfile_removed" = true ] && [ "$site_stopped" = true ]; then
              exit 0
            fi

            sleep 2
          done

          echo "Ghost local process did not fully stop within the retry window"
          exit 1
      - name: Starting Ghost instance
        run: node ./cli/bin/ghost start -d ghost
      - name: Verifying Restart
        run: |
          for attempt in {1..15}; do
            if [ -f ghost/.ghostpid ] && \
              [ "$(cat ghost/.ghostpid)" != "$LOCAL_BEFORE_PID" ] && \
              curl -fsS http://localhost:2368 | grep -qi ghost; then
              exit 0
            fi
            sleep 2
          done

          echo "Ghost local process did not restart with a new pid"
          exit 1

  local-e2e-macos:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: macos-latest
    name: Local E2E (macos-latest)
